[package]
name = "seadata"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Leeway data server: forecasts, seamark tiles, chart packs and AIS for the Leeway iOS app"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

# Venvy starts Rust apps with a plain `cargo run`, i.e. the dev profile: make that one fast too.
[profile.dev]
opt-level = 2
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 3
