name: Leeway
options:
  bundleIdPrefix: com.nikolausmarek
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Leeway:
    type: application
    platform: iOS
    sources:
      - path: Leeway
        excludes: ["Charts/**"]
      - path: Leeway/Charts
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: LeewayWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.leeway
        # Personal team (free provisioning): device builds expire after 7 days.
        DEVELOPMENT_TEAM: C5MSK2XBMK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Routing and chart rendering crunch millions of grid cells; unoptimised builds are too slow to try out.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Leeway/Info.plist
      properties:
        CFBundleDisplayName: Leeway
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Leeway shows your position on the chart and records your track.
        NSLocationAlwaysAndWhenInUseUsageDescription: Leeway keeps recording your track while the screen is off.
        NSLocalNetworkUsageDescription: Leeway can use a data server on your local network, for example one on board.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  LeewayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LeewayWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.leeway.widgets
        DEVELOPMENT_TEAM: C5MSK2XBMK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: LeewayWidgets/Info.plist
      properties:
        CFBundleDisplayName: Leeway
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
