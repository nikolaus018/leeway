name: Leeway
options:
  bundleIdPrefix: com.nikolausmarek
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Leeway:
    type: application
    platform: iOS
    sources:
      - path: Leeway
        excludes: ["Charts/**"]
      - path: Leeway/Charts
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: LeewayWidgets
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.leeway
        # Personal team (free provisioning): device builds expire after 7 days.
        DEVELOPMENT_TEAM: C5MSK2XBMK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Routing and chart rendering crunch millions of grid cells; unoptimised builds are too slow to try out.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Leeway/Info.plist
      properties:
        CFBundleDisplayName: Leeway
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Leeway shows your position on the chart and records your track.
        NSLocationAlwaysAndWhenInUseUsageDescription: Leeway keeps recording your track while the screen is off.
        NSLocalNetworkUsageDescription: Leeway connects to your boat's instruments and AIS over Wi-Fi, and can use a data server on board.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  LeewayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeewayTests
    dependencies:
      - target: Leeway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.leeway.tests
        DEVELOPMENT_TEAM: C5MSK2XBMK
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  LeewayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LeewayWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.leeway.widgets
        DEVELOPMENT_TEAM: C5MSK2XBMK
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: LeewayWidgets/Info.plist
      properties:
        CFBundleDisplayName: Leeway
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Leeway:
    build:
      targets:
        Leeway: all
        LeewayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LeewayTests
